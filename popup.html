<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Purrfect CSS</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div class="brand">
          <div class="mascot-wrap">
            <img
              src="images/tuxedo_cat_48.png"
              alt="Purrfect CSS tuxedo cat mascot"
              class="cat-image"
            />
            <span class="cat-fallback" aria-hidden="true">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 7-.42 7 .57 1.07 1 2.24 1 3.44C21 17.9 16.97 21 12 21s-9-3-9-7.56c0-1.25.5-2.4 1-3.44 0 0-1.89-6.42-.5-7 1.39-.58 4.72.23 6.5 2.23A9.04 9.04 0 0 1 12 5Z"
                />
                <path d="M8 14v.5" />
                <path d="M16 14v.5" />
                <path d="M11.25 16.25h1.5L12 17l-.75-.75Z" />
              </svg>
            </span>
          </div>
          <h1>Purrfect CSS</h1>
        </div>
      </header>

      <nav class="quick-actions" aria-label="Purrfect CSS shortcuts">
        <button
          id="sidepanel-button"
          class="quick-action inspector-action"
          type="button"
          aria-label="Open design inspector"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <path d="M15 3v18" />
          </svg>
          <span class="button-tooltip" aria-hidden="true"
            >Open design inspector</span
          >
        </button>
        <button
          id="dashboard-button"
          class="quick-action"
          type="button"
          aria-label="Open dashboard"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <path d="M3 9h18" />
            <path d="M9 21V9" />
          </svg>
          <span class="button-tooltip" aria-hidden="true">Open dashboard</span>
        </button>
        <button
          id="close-button"
          class="quick-action close-action"
          type="button"
          aria-label="Close popup"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
          <span class="button-tooltip" aria-hidden="true">Close</span>
        </button>
      </nav>

      <div class="domain-status">
        <span class="status-dot" aria-hidden="true"></span>
        <div>
          <p id="page-name" class="page-name">Checking the current page...</p>
          <p id="domain-status" class="domain-status-copy">
            Checking domain rules...
          </p>
        </div>
      </div>

      <div class="library-control">
        <label id="stylesheet-picker-label" for="stylesheet-picker-button"
          >Stylesheet</label
        >
        <div class="picker">
          <button
            id="stylesheet-picker-button"
            class="picker-button"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-labelledby="stylesheet-picker-label stylesheet-picker-name"
          >
            <span id="stylesheet-picker-name">Custom CSS</span>
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="m6 9 6 6 6-6"></path>
            </svg>
          </button>
          <div
            id="stylesheet-picker-menu"
            class="picker-menu"
            role="listbox"
            hidden
          ></div>
        </div>
      </div>

      <div class="editor-header">
        <label for="css-input">CSS editor</label>
        <div class="file-controls">
          <input
            id="css-file-input"
            type="file"
            accept=".css,text/css"
            hidden
          />
          <button
            id="upload-button"
            type="button"
            class="btn-ghost"
            aria-label="Upload CSS"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M12 3v12m5-7-5-5-5 5m14 7v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
              />
            </svg>
            <span class="button-tooltip" aria-hidden="true">Upload CSS</span>
          </button>
          <button
            id="export-button"
            type="button"
            class="btn-ghost"
            aria-label="Export CSS"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              class="lucide lucide-download preview-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M12 15V3m9 12v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <path d="m7 10 5 5 5-5" />
            </svg>
            <span class="button-tooltip" aria-hidden="true">Export CSS</span>
          </button>
        </div>
      </div>

      <textarea
        id="css-input"
        maxlength="262144"
        spellcheck="false"
        placeholder="For example:
body {
  background: #0f172a;
}"
      ></textarea>

      <div class="buttons">
        <button id="apply-button" class="primary" type="button">
          Apply CSS
        </button>
        <button id="remove-button" type="button">Remove CSS</button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite">
        Your draft is saved on this device.
      </p>
    </main>

    <footer id="support-footer">
      <span class="footer-copy">
        I write the bugs, and my cats walk across the keyboard to fix them.
        Click the cats' paw to fund my cats' treat addiction.
      </span>
      <a
        href="https://venmo.com/u/Byron-Mena"
        target="_blank"
        rel="noopener noreferrer"
        class="paw-link"
        title="Support isn't required, but my feline overlords expects tribute"
        aria-label="Support Purrfect CSS on Venmo"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-paw-print preview-icon"
        >
          <circle cx="11" cy="4" r="2" />
          <circle cx="18" cy="8" r="2" />
          <circle cx="20" cy="16" r="2" />
          <path
            d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"
          />
        </svg>
      </a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
